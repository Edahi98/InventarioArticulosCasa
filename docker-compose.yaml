services:
  db:
    image: supabase/postgres:15.8.1.060
    container_name: inventario-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./supabase/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: inventario-backend
    ports:
      - "4000:4000"
    env_file:
      # Acá van JWT_PRIVATE_KEY y CLOUDINARY_URL (requeridas)
      - ./backend/.env
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/postgres
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:$${PORT}/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Sobreescribir con la URL pública real del backend en despliegues fuera de localhost
        # (ej. VITE_API_URL=https://mi-servidor.com:4000 en un .env junto a este compose)
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    container_name: inventario-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  agente:
    build: ./agente
    container_name: inventario-agente
    env_file:
      # Acá van OPENROUTER_API_KEY, TELEGRAM_TOKEN y WEB_URL. El agente no tiene credenciales:
      # las personas vinculan su cuenta desde la web con un código
      - ./agente/.env
    environment:
      BACKEND_URL: http://inventario-backend:4000
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      MODE: telegram
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
