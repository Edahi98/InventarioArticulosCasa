services:
  db:
    image: supabase/postgres:15.8.1.060
    container_name: inventario-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./supabase/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: inventario-backend
    ports:
      - "4000:4000"
    env_file:
      # Acá van JWT_SECRET y CLOUDINARY_* (requeridas)
      - ./backend/.env
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/postgres
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:$${PORT}/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Sobreescribir con la URL pública real del backend en despliegues fuera de localhost
        # (ej. VITE_API_URL=https://mi-servidor.com:4000 en un .env junto a este compose)
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    container_name: inventario-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  agente:
    build: ./agente
    container_name: inventario-agente
    # BACKEND_URL/PUBLIC_URL/OPENROUTER_MODEL son de red interna del compose: se definen acá (no en
    # agente/.env, que NO puede sobreescribir claves ya listadas en `environment:`). Para
    # cambiarlas usá un .env junto a este compose (ver variables ${...} abajo).
    environment:
      BACKEND_URL: http://inventario-backend:4000
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:4000}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      # telegram = bot de Telegram | server = API HTTP en :5000 | cli = terminal
      MODE: ${AGENTE_MODE:-telegram}
      PORT: 5000
    env_file:
      # Acá van INVENTARIO_USER / INVENTARIO_PASS (login contra el backend), TELEGRAM_TOKEN (BotFather) y OPENROUTER_API_KEY
      - path: ./agente/.env
        required: false
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
